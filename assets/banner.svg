<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360" style="background:#090d16; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif; border-radius:14px; overflow:hidden;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.85" />
    </linearGradient>

    <linearGradient id="streamGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0" />
      <stop offset="50%" stop-color="#ec4899" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Animated Shimmer Wave -->
    <style>
      @keyframes floatPill {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-7px); }
      }
      @keyframes floatPillReverse {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(7px); }
      }
      @keyframes pulseRing {
        0% { transform: scale(0.96); opacity: 0.4; }
        50% { transform: scale(1.04); opacity: 0.85; }
        100% { transform: scale(0.96); opacity: 0.4; }
      }
      @keyframes audioWave {
        0%, 100% { height: 12px; }
        50% { height: 38px; }
      }
      @keyframes trackDash {
        to { stroke-dashoffset: -100; }
      }
      .anim-pill1 { animation: floatPill 5s ease-in-out infinite; }
      .anim-pill2 { animation: floatPillReverse 6s ease-in-out infinite; }
      .anim-pill3 { animation: floatPill 5.5s ease-in-out infinite 1s; }
      .anim-pulse { transform-origin: center; animation: pulseRing 4s ease-in-out infinite; }
      .anim-dash { stroke-dasharray: 8, 8; animation: trackDash 3s linear infinite; }
    </style>
  </defs>

  <!-- Deep Background -->
  <rect width="1200" height="360" fill="url(#bgGlow)" />

  <!-- Animated Glowing Background Orbs & Flow Streams -->
  <g opacity="0.35">
    <circle cx="150" cy="80" r="140" fill="#ec4899" filter="url(#glow)" opacity="0.25" class="anim-pulse" />
    <circle cx="1060" cy="180" r="160" fill="#3b82f6" filter="url(#glow)" opacity="0.25" class="anim-pulse" />
    <circle cx="600" cy="320" r="120" fill="#8b5cf6" filter="url(#glow)" opacity="0.2" class="anim-pulse" />
  </g>

  <!-- Grid Pattern Overlay in background -->
  <g opacity="0.07" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="60" x2="1200" y2="60" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="150" y1="0" x2="150" y2="360" />
    <line x1="300" y1="0" x2="300" y2="360" />
    <line x1="450" y1="0" x2="450" y2="360" />
    <line x1="600" y1="0" x2="600" y2="360" />
    <line x1="750" y1="0" x2="750" y2="360" />
    <line x1="900" y1="0" x2="900" y2="360" />
    <line x1="1050" y1="0" x2="1050" y2="360" />
  </g>

  <!-- Flowing Dynamic Process Path in background -->
  <path d="M 60,300 C 300,340 450,260 650,290 C 850,320 1000,270 1140,310" fill="none" stroke="url(#accentGrad)" stroke-width="2.5" opacity="0.3" class="anim-dash" />

  <!-- Background Animated Cards / Floating Tech Badges (Non-obstructing, placed at corners/sides) -->
  <g class="anim-pill1" transform="translate(870, 42)">
    <rect width="250" height="42" rx="21" fill="url(#cardGrad)" stroke="#8b5cf6" stroke-width="1.2" />
    <circle cx="24" cy="21" r="9" fill="#10b981" />
    <text x="44" y="26" fill="#e2e8f0" font-size="13" font-weight="600">✂️ 16:9 ➔ 9:16 Auto Reframe</text>
  </g>

  <g class="anim-pill2" transform="translate(890, 100)">
    <rect width="230" height="42" rx="21" fill="url(#cardGrad)" stroke="#ec4899" stroke-width="1.2" />
    <circle cx="24" cy="21" r="9" fill="#ec4899" />
    <text x="44" y="26" fill="#e2e8f0" font-size="13" font-weight="600">🎙️ Whisper Word Subtitles</text>
  </g>

  <g class="anim-pill3" transform="translate(860, 158)">
    <rect width="260" height="42" rx="21" fill="url(#cardGrad)" stroke="#3b82f6" stroke-width="1.2" />
    <circle cx="24" cy="21" r="9" fill="#3b82f6" />
    <text x="44" y="26" fill="#e2e8f0" font-size="13" font-weight="600">🔥 AI Virality Hook Detection</text>
  </g>

  <!-- Dynamic Waveform / Equalizer Visualizer at bottom right -->
  <g transform="translate(930, 260)" opacity="0.65">
    <rect x="0" y="0" width="6" height="28" rx="3" fill="#8b5cf6">
      <animate attributeName="height" values="10;32;12;28;10" dur="1.4s" repeatCount="indefinite" />
      <animate attributeName="y" values="18;-4;16;0;18" dur="1.4s" repeatCount="indefinite" />
    </rect>
    <rect x="14" y="0" width="6" height="35" rx="3" fill="#ec4899">
      <animate attributeName="height" values="24;8;38;16;24" dur="1.2s" repeatCount="indefinite" />
      <animate attributeName="y" values="4;20;-10;12;4" dur="1.2s" repeatCount="indefinite" />
    </rect>
    <rect x="28" y="0" width="6" height="20" rx="3" fill="#3b82f6">
      <animate attributeName="height" values="8;30;14;34;8" dur="1.6s" repeatCount="indefinite" />
      <animate attributeName="y" values="20;-2;14;-6;20" dur="1.6s" repeatCount="indefinite" />
    </rect>
    <rect x="42" y="0" width="6" height="36" rx="3" fill="#10b981">
      <animate attributeName="height" values="32;12;26;8;32" dur="1.3s" repeatCount="indefinite" />
      <animate attributeName="y" values="-4;16;2;20;-4" dur="1.3s" repeatCount="indefinite" />
    </rect>
    <rect x="56" y="0" width="6" height="22" rx="3" fill="#8b5cf6">
      <animate attributeName="height" values="12;36;18;28;12" dur="1.5s" repeatCount="indefinite" />
      <animate attributeName="y" values="16;-8;10;0;16" dur="1.5s" repeatCount="indefinite" />
    </rect>
    <rect x="70" y="0" width="6" height="30" rx="3" fill="#ec4899">
      <animate attributeName="height" values="22;14;34;12;22" dur="1.1s" repeatCount="indefinite" />
      <animate attributeName="y" values="6;14;-6;16;6" dur="1.1s" repeatCount="indefinite" />
    </rect>
    <rect x="84" y="0" width="6" height="18" rx="3" fill="#3b82f6">
      <animate attributeName="height" values="8;28;10;32;8" dur="1.7s" repeatCount="indefinite" />
      <animate attributeName="y" values="20;0;18;-4;20" dur="1.7s" repeatCount="indefinite" />
    </rect>
  </g>

  <!-- FOREGROUND: Clear Title, Subtitle, and Pills that NEVER get obstructed -->
  <g transform="translate(60, 48)">
    <!-- Category Mini-Badge -->
    <rect width="186" height="28" rx="14" fill="#8b5cf6" fill-opacity="0.22" stroke="#8b5cf6" stroke-width="1.2" />
    <text x="14" y="19" fill="#c4b5fd" font-size="12" font-weight="700" letter-spacing="0.8">⚡ CURATED REPOSITORY</text>

    <!-- Main Title (Gradient Foreground) -->
    <text x="0" y="80" fill="url(#accentGrad)" font-size="40" font-weight="900" letter-spacing="-0.5">Awesome Video Editing &amp;</text>
    <text x="0" y="130" fill="#ffffff" font-size="40" font-weight="900" letter-spacing="-0.5">Clipper Automation 🎬✨</text>

    <!-- Subtitle (Clear Foreground) -->
    <text x="0" y="174" fill="#cbd5e1" font-size="17" font-weight="400">
      AI Viral Clip Extractors • Auto-Reframing (16:9 ➔ 9:16) • Dynamic Subtitles • Video Repurposing
    </text>

    <!-- Feature Tags Row in Foreground -->
    <g transform="translate(0, 210)">
      <rect x="0" y="0" width="130" height="32" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="16" y="21" fill="#93c5fd" font-size="13" font-weight="600">🤖 AI Virality</text>

      <rect x="142" y="0" width="152" height="32" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="156" y="21" fill="#f472b6" font-size="13" font-weight="600">🎯 Speaker Tracking</text>

      <rect x="306" y="0" width="168" height="32" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="320" y="21" fill="#c084fc" font-size="13" font-weight="600">⚡ Silence Removal</text>

      <rect x="486" y="0" width="154" height="32" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="500" y="21" fill="#6ee7b7" font-size="13" font-weight="600">💬 Whisper Subtitles</text>
    </g>
  </g>

  <!-- Bottom Accent Gradient Line -->
  <rect x="0" y="354" width="1200" height="6" fill="url(#accentGrad)" />
</svg>
